# stocks_etl/config.yaml
start: "2015-01-01"   # más historia = más regímenes vistos (2018, 2020, 2022, 2025)
end: null
interval: "1d"

# Precios y eventos
auto_adjust: false      # mantener Close sin ajustar; adj_close viene aparte
actions: true

# Concurrencia y calendario
threads: 1
calendar: "NYSE"

# Salida local
output_dir: "data"
csv_compression: null  # null | gzip

# Universo: ÚNICA fuente de verdad. Se publica en docs/data/universe.json y de ahí
# lo leen el dashboard y news_etl. Sectores distintos + activos poco correlacionados
# (oro, bonos) para que la diversificación sea real, no "10 tech distintas".
universe:
  Tecnología: [AAPL, MSFT, GOOGL, AMZN, NVDA]
  Salud: [JNJ, UNH, PFE]
  Energía: [XOM, CVX]
  Finanzas: [JPM, BAC, GS]
  Consumo básico: [PG, KO, WMT]
  Consumo discrecional: [HD, MCD]
  Industria: [CAT, BA]
  Utilities: [NEE]
  ETFs: [SPY, QQQ, GLD, TLT]

# Parámetros cuantitativos. Están fijados de antemano: cada cambio cuenta como un
# intento nuevo en docs/data/history/trials_log.csv y el Deflated Sharpe lo castiga.
quant:
  benchmark: SPY
  regime_source: market # el estrés del mercado (HMM de SPY) apaga la operativa
  hmm_restarts: 10      # reinicios de EM: evita que el régimen salte entre óptimos locales
  seed: 42
  hurst_window: 100
  ou_span: 20
  ou_window: 100
  z_entry: 1.5          # |z| para entrar en reversión a la media
  max_half_life: 20     # vida media máxima operable (sesiones)
  momentum_horizon: 10  # barrera de tiempo de momentum (sesiones)
  t_max_min: 3
  t_max_cap: 20
  k_tp: 1.5             # take profit = k_tp · σ_GARCH · sqrt(t_max)
  k_sl: 1.5             # stop loss   = k_sl · σ_GARCH · sqrt(t_max)
  cost_bps: 5           # por lado (10 pb ida y vuelta)
  kelly_fraction: 0.5   # nunca Kelly completo
  target_vol: 0.20      # volatilidad anual objetivo por posición
  n_splits: 5           # Purged K-Fold
  embargo_pct: 0.01
  cpcv_groups: 6
  cpcv_k: 2
  mc_horizon: 20
  mc_paths: 10000

# Meta-modelos deep (workflow semanal deep-weekly.yml). Solo se promueven si su
# Deflated Sharpe > 0.95 y mejoran al XGBoost sobre los mismos eventos.
deep:
  lookback: 20          # sesiones de features que ve el LSTM
  epochs: 8
  hidden: 32
  news_days: 5          # noticias de los 5 días previos (nunca del mismo día)
  news_items: 8
  min_news_events: 500  # bajo esto la fusión con noticias no se entrena

# Publicación a GitHub Pages (comprometido al repo por el workflow)
publish:
  docs_dir: "docs/data"
  price_window_days: 60
