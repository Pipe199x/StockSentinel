name: ETL News (cron + manual)

on:
  schedule:
    - cron: "15 12 * * *"   # 12:15 UTC daily; NewsAPI free tier delays articles ~24h
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  etl_news:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      TICKERS: "AMZN,MSFT,GOOGL"
      LANGUAGE: "en"
      DAYS: "2"   # incremental fetch; history accumulates in docs/data/history/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: news_etl/requirements.txt

      - name: Cache Hugging Face model (FinBERT)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1

      - name: Install deps (torch CPU wheel first)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r news_etl/requirements.txt

      - name: Prepare data dir
        run: mkdir -p data

      - name: Fetch raw news (NewsAPI)
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          set -euo pipefail
          python -m news_etl.news_client \
            --out data/news_raw.ndjson \
            --tickers "${TICKERS}" \
            --language "${LANGUAGE}" \
            --days "${DAYS}"
          test -s data/news_raw.ndjson

      - name: Run ETL (merge history + FinBERT sentiment + publish to docs/)
        run: |
          set -euo pipefail
          python -m news_etl.news_etl --config news_etl/config.yaml
          echo "=== docs/data ==="
          ls -lR docs/data

      - name: Commit & push data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: news update $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 15
          done
