name: ETL News (cron + manual)

on:
  schedule:
    - cron: "15 12 * * *"   # 12:15 UTC daily (Massive news, no quota limit)
    # Backup run: only does work if the primary run did not publish (see guard step).
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  etl_news:
    # Pinned so a runner image migration cannot silently break the daily job
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Skip backup run if data is already fresh
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event.schedule }}" != "0 20 * * *" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          try:
              m = json.load(open("docs/data/manifest.json"))
              ts = datetime.fromisoformat(m["news"]["last_updated_utc"])
              age_h = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
          except Exception:
              age_h = float("inf")  # unreadable manifest: run the ETL
          print(f"skip={'true' if age_h < 12 else 'false'}")
          EOF
          cat "$GITHUB_OUTPUT"

      # Tickers come from docs/data/universe.json (the 21 stocks, no ETFs): one source of truth.
      - name: Update news (fetch + FinBERT + publish to docs/data)
        if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/update-news
        with:
          massive_api_key: ${{ secrets.MASSIVE_API_KEY }}
          days: "2"

      - name: Verify published JSON is strict JSON (no NaN)
        if: steps.guard.outputs.skip != 'true'
        run: python -m etl_common.check_json docs/data

      - name: Commit & push data
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: news update $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            sleep 15
          done
          # Without this the loop would end with sleep's status and hide a failed push
          echo "Push failed after 3 attempts"
          exit 1
