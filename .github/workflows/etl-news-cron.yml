name: ETL News (cron + manual)

on:
  schedule:
    - cron: "15 12 * * *"   # 12:15 UTC daily; NewsAPI free tier delays articles ~24h
    # Backup run: only does work if the primary run did not publish (see guard step).
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  etl_news:
    # Pinned so a runner image migration cannot silently break the daily job
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      PYTHON_VERSION: "3.11"
      TICKERS: "AMZN,MSFT,GOOGL"
      LANGUAGE: "en"
      DAYS: "2"   # incremental fetch; history accumulates in docs/data/history/

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Skip backup run if data is already fresh
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event.schedule }}" != "0 20 * * *" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          try:
              m = json.load(open("docs/data/manifest.json"))
              ts = datetime.fromisoformat(m["news"]["last_updated_utc"])
              age_h = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
          except Exception:
              age_h = float("inf")  # unreadable manifest: run the ETL
          print(f"skip={'true' if age_h < 12 else 'false'}")
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: news_etl/requirements.txt

      - name: Cache Hugging Face model (FinBERT)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1

      - name: Install deps (torch CPU wheel first)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r news_etl/requirements.txt

      - name: Prepare data dir
        if: steps.guard.outputs.skip != 'true'
        run: mkdir -p data

      - name: Fetch raw news (NewsAPI)
        if: steps.guard.outputs.skip != 'true'
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          set -euo pipefail
          python -m news_etl.news_client \
            --out data/news_raw.ndjson \
            --tickers "${TICKERS}" \
            --language "${LANGUAGE}" \
            --days "${DAYS}"
          test -s data/news_raw.ndjson

      - name: Run ETL (merge history + FinBERT sentiment + publish to docs/)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m news_etl.news_etl --config news_etl/config.yaml
          echo "=== docs/data ==="
          ls -lR docs/data

      - name: Verify published JSON is strict JSON (no NaN)
        if: steps.guard.outputs.skip != 'true'
        run: python -m etl_common.check_json docs/data

      - name: Commit & push data
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: news update $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            sleep 15
          done
          # Without this the loop would end with sleep's status and hide a failed push
          echo "Push failed after 3 attempts"
          exit 1
