name: ETL Stocks (cron + manual)

on:
  schedule:
    # 01:30 UTC: after the post-market session, so the day's volume bar is final.
    - cron: "30 1 * * *"
    # Backup: GitHub starts scheduled runs hours late (up to ~8 h observed). 04:00 + 8 h is
    # still before the 13:30 UTC summer open. The old 07:00 backup started at 14:59 UTC on
    # 2026-11-13, mid-session, and published from a partial bar.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  etl_stocks:
    # Pinned so a runner image migration cannot silently break the daily job
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Skip scheduled run if data already covers the last completed session
        id: guard
        run: |
          set -euo pipefail
          # Manual runs always execute. Scheduled runs (primary and backup) skip when
          # manifest.stocks.as_of already covers the last session that has closed; this
          # also skips weekend reruns. Standard library only (runs before setup-python).
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            python3 -m etl_common.freshness docs/data/manifest.json >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: stocks_etl/requirements.txt

      - name: Install deps
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r stocks_etl/requirements.txt

      - name: Unit tests (purged CV, triple barrier, DSR, risk)
        if: steps.guard.outputs.skip != 'true'
        run: python -m pytest tests -q

      # News up to the signal day's 20:00 UTC cutoff BEFORE the features are built, so live
      # features see the same articles the backtest will see later (GitHub delays the news cron
      # by hours). Best effort: if it fails, the ETL runs with the news it has and publishes
      # data_freshness.news_fresh = false.
      - name: Update news up to the cutoff
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        uses: ./.github/actions/update-news
        with:
          massive_api_key: ${{ secrets.MASSIVE_API_KEY }}
          days: "2"

      - name: Run ETL (prices + regime + meta-labeled signals + validation + publish to docs/)
        if: steps.guard.outputs.skip != 'true'
        env:
          # Prices come from Massive only. Sent only as an Authorization header, never logged.
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          set -euo pipefail
          # Second layer of retries for Massive outages lasting longer than the
          # in-process request retries.
          for i in 1 2 3; do
            if python -m stocks_etl.stocks_etl --config stocks_etl/config.yaml; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "ETL failed after $i attempts"
              exit 1
            fi
            echo "ETL attempt $i failed; retrying in 60s"
            sleep 60
          done
          echo "=== docs/data ==="
          ls -lR docs/data

      - name: Verify published JSON is strict JSON (no NaN)
        if: steps.guard.outputs.skip != 'true'
        run: python -m etl_common.check_json docs/data

      - name: Commit & push data
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: stocks + news update $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            sleep 15
          done
          # Without this the loop would end with sleep's status and hide a failed push
          echo "Push failed after 3 attempts"
          exit 1
