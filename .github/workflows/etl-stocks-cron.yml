name: ETL Stocks (cron + manual)

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC, after NYSE close
    # Backup run: only does work if the primary run did not publish (see guard step).
    # GitHub often starts scheduled runs 2-4 h late, so leave a wide margin.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  etl_stocks:
    # Pinned so a runner image migration cannot silently break the daily job
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHON_VERSION: "3.11"
      # Keep yfinance's SQLite cache out of any shared/restored location
      XDG_CACHE_HOME: ${{ runner.temp }}/cache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Skip backup run if data is already fresh
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event.schedule }}" != "0 7 * * *" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          try:
              m = json.load(open("docs/data/manifest.json"))
              ts = datetime.fromisoformat(m["stocks"]["last_updated_utc"])
              age_h = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
          except Exception:
              age_h = float("inf")  # unreadable manifest: run the ETL
          print(f"skip={'true' if age_h < 12 else 'false'}")
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: stocks_etl/requirements.txt

      - name: Install deps
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r stocks_etl/requirements.txt

      - name: Run ETL (prices + XGBoost forecast + publish to docs/)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Second layer of retries for Yahoo outages/rate limits lasting longer
          # than the in-process per-ticker retries.
          for i in 1 2 3; do
            if python -m stocks_etl.stocks_etl --config stocks_etl/config.yaml; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "ETL failed after $i attempts"
              exit 1
            fi
            echo "ETL attempt $i failed; retrying in 60s"
            sleep 60
          done
          echo "=== docs/data ==="
          ls -lR docs/data

      - name: Verify published JSON is strict JSON (no NaN)
        if: steps.guard.outputs.skip != 'true'
        run: python -m etl_common.check_json docs/data

      - name: Commit & push data
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: stocks update $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            sleep 15
          done
          # Without this the loop would end with sleep's status and hide a failed push
          echo "Push failed after 3 attempts"
          exit 1
