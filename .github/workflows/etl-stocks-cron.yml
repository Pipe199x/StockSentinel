name: ETL Stocks (cron + manual)

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC, after NYSE close
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  etl_stocks:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: stocks_etl/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r stocks_etl/requirements.txt

      - name: Run ETL (prices + XGBoost forecast + publish to docs/)
        run: |
          set -euo pipefail
          python -m stocks_etl.stocks_etl --config stocks_etl/config.yaml
          echo "=== docs/data ==="
          ls -lR docs/data

      - name: Commit & push data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: stocks update $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 15
          done
