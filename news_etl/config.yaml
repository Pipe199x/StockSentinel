# news_etl/config.yaml
runtime:
  timezone: UTC
  today_override: ""

window:
  last_n_days: 15

tickers:
  # Los tickers de cada noticia son las etiquetas de Massive dentro del universo bursátil
  # (docs/data/universe.json, las 21 acciones). Estos alias son solo el respaldo para items
  # sin etiquetas. Solo términos de empresa: los nombres de producto (alexa, xbox, android...)
  # etiquetan ofertas de consumo, y los símbolos sueltos (ko, ba, hd, gs) palabras comunes.
  universe:
    AMZN: ["amazon", "aws"]
    MSFT: ["microsoft", "azure", "copilot", "bing"]
    GOOGL: ["google", "alphabet", "youtube"]
  restrict_to_universe: true

# Free local sentiment (replaces Azure AI Language)
sentiment:
  enabled: true
  model: "ProsusAI/finbert"
  device: "cpu"
  batch_size: 16
  max_length: 512

limits:
  preview_csv_max_rows: 1000

daily_limits:
  per_ticker_limit: 3
  include_no_ticker: false
  no_ticker_per_day_limit: 0

paths:
  # Acepta archivo, *glob* o directorio para raw_ndjson.
  raw_ndjson: "data/news_raw.ndjson"
  out_ndjson: "data/news_YYYYMMDD.ndjson"
  out_preview_csv: "data/news_preview_YYYYMMDD.csv"
  heartbeat: "data/heartbeat.txt"
  # Publicación a docs/data (dashboard privado tras Cloudflare Access; el workflow lo commitea)
  history_ndjson: "docs/data/history/news_history.ndjson"
  latest_json: "docs/data/news_latest.json"
  manifest: "docs/data/manifest.json"
  # Los embeddings FinBERT del modelo de fusión los calcula el job semanal (stocks_etl/deep)
